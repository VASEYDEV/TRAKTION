name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: verify / repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Check repository policy and structured files
        run: bash scripts/check-repository.sh
      - name: Verify native inventory, Release validation and diagnostics guards
        run: python3 -m unittest discover -s Tests/Repository -v

  core-linux:
    name: verify / core (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Build and test platform-neutral targets
        env:
          TRAKTION_GOLDEN_ARTIFACTS: ${{ runner.temp }}/traktion-synthetic-artifacts/tests
        run: bash scripts/verify-core.sh
      - name: Install python3 for manifest validation
        run: apt-get update -q && apt-get install -y -q python3
      - name: PNG smoke (pure-Swift fallback codec end to end)
        run: bash scripts/smoke.sh
      - name: Evaluation harness (EVALUATION.md metrics gate)
        run: |
          swift build --configuration release --product traktion-lab
          "$(swift build --configuration release --show-bin-path)/traktion-lab" evaluate --output evaluation-report.json --artifacts-dir "${{ runner.temp }}/traktion-synthetic-artifacts/evaluation"
          "$(swift build --configuration release --show-bin-path)/traktion-lab" evaluate --case performance-phone-3 --output performance-phone-3-linux.json
          "$(swift build --configuration release --show-bin-path)/traktion-lab" evaluate --case performance-long-10 --output performance-long-10-linux.json
          python3 -m json.tool evaluation-report.json >/dev/null
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: traktion-evaluation-report
          path: |
            evaluation-report.json
            performance-*-linux.json
          if-no-files-found: ignore

      - name: Retain synthetic golden and evaluation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: traktion-synthetic-failure-diagnostics-linux
          path: ${{ runner.temp }}/traktion-synthetic-artifacts
          if-no-files-found: ignore

  apple:
    name: verify / Apple package and PNG smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Run complete verification gate
        env:
          TRAKTION_SMOKE_DIR: ${{ runner.temp }}/traktion-smoke
          TRAKTION_GOLDEN_ARTIFACTS: ${{ runner.temp }}/traktion-synthetic-artifacts/tests
        run: bash scripts/gate.sh
      - name: Evaluation and fresh-process performance reports
        run: |
          swift build --configuration release --product traktion-lab
          "$(swift build --configuration release --show-bin-path)/traktion-lab" evaluate --output evaluation-report-apple.json --artifacts-dir "${{ runner.temp }}/traktion-synthetic-artifacts/evaluation"
          "$(swift build --configuration release --show-bin-path)/traktion-lab" evaluate --case performance-phone-3 --output performance-phone-3-apple.json
          "$(swift build --configuration release --show-bin-path)/traktion-lab" evaluate --case performance-long-10 --output performance-long-10-apple.json
      - name: Upload Apple evaluation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: traktion-evaluation-report-apple
          path: |
            evaluation-report-apple.json
            performance-*-apple.json
          if-no-files-found: ignore
      - name: Retain synthetic diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: traktion-synthetic-smoke-diagnostics
          path: ${{ runner.temp }}/traktion-smoke
          if-no-files-found: ignore

      - name: Retain synthetic golden diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: traktion-synthetic-failure-diagnostics-apple
          path: ${{ runner.temp }}/traktion-synthetic-artifacts
          if-no-files-found: ignore

  ios-release:
    name: verify / iOS device Release
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Build and validate ordinary unsigned device Release
        run: python3 scripts/verify-ios-release.py --artifacts "${{ runner.temp }}/traktion-ios-release"
      - name: Retain device Release verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: traktion-ios-device-release
          path: |
            ${{ runner.temp }}/traktion-ios-release/run.*/*.log
            ${{ runner.temp }}/traktion-ios-release/run.*/*.json
            ${{ runner.temp }}/traktion-ios-release/run.*/*.txt
          if-no-files-found: warn

  ios:
    name: verify / iOS simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Build, install, launch, and test the native PNG workflow
        env:
          TRAKTION_IOS_ARTIFACTS: ${{ runner.temp }}/traktion-ios
        run: bash scripts/verify-ios.sh
      - name: Retain simulator test results and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: traktion-ios-verification
          path: |
            ${{ runner.temp }}/traktion-ios/run.*/*.txt
            ${{ runner.temp }}/traktion-ios/run.*/*.json
            ${{ runner.temp }}/traktion-ios/run.*/*.log
            ${{ runner.temp }}/traktion-ios/run.*/*.xcresult
            ${{ runner.temp }}/traktion-ios/run.*/attachments
          if-no-files-found: warn

  required:
    name: verification / required
    if: always()
    needs: [repository, core-linux, apple, ios-release, ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification lane
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          CORE_LINUX_RESULT: ${{ needs.core-linux.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          IOS_RELEASE_RESULT: ${{ needs.ios-release.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$CORE_LINUX_RESULT" = success
          test "$APPLE_RESULT" = success
          test "$IOS_RESULT" = success
          test "$IOS_RELEASE_RESULT" = success
